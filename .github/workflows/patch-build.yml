name: patch-build

on:
  push:
    branches: ["fix/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.patch
          push: true
          tags: |
            ghcr.io/lemondoublehq/immich-upload-optimizer:v1.0.1-assetv2
            ghcr.io/lemondoublehq/immich-upload-optimizer:sha-${{ github.sha }}
